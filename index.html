<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTech Academy - Gerenciamento de Alunos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">DevTech Academy - Gerenciamento de Alunos</span>
        </div>
    </nav>

    <div class="container pb-5">
        <!-- Seção de Cadastro / Edição -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="card-title mb-0">Cadastro de Alunos</h5>
            </div>
            <div class="card-body">
                <form id="form-aluno">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" placeholder="Nome completo" required>
                        </div>
                        <div class="col-md-2">
                            <label for="idade" class="form-label">Idade</label>
                            <input type="number" class="form-control" id="idade" placeholder="Ex: 22" required>
                        </div>
                        <div class="col-md-3">
                            <label for="curso" class="form-label">Curso</label>
                            <select class="form-select" id="curso" required>
                                <option value="">Selecione um curso</option>
                                <option value="JavaScript">JavaScript</option>
                                <option value="Python">Python</option>
                                <option value="Java">Java</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="notaFinal" class="form-label">Nota Final</label>
                            <input type="number" class="form-control" id="notaFinal" step="0.1" min="0" max="10" placeholder="0.0 a 10.0" required>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="button" class="btn btn-primary" id="btn-salvar">Cadastrar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Seção da Tabela -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white">
                <h5 class="card-title mb-0">Lista de Alunos</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Nome</th>
                                <th>Idade</th>
                                <th>Curso</th>
                                <th>Nota Final</th>
                                <th>Situação</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-corpo">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Seção de Relatórios -->
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="card-title mb-0">Relatórios</h5>
            </div>
            <div class="card-body">
                <div class="d-flex flex-wrap gap-2 mb-3">
                    <button type="button" class="btn btn-outline-success btn-sm" id="btn-rel-aprovados">Listar Aprovados</button>
                    <button type="button" class="btn btn-outline-primary btn-sm" id="btn-rel-media-notas">Média das Notas</button>
                    <button type="button" class="btn btn-outline-primary btn-sm" id="btn-rel-media-idades">Média das Idades</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-rel-ordem-alfabetica">Ordem Alfabética</button>
                    <button type="button" class="btn btn-outline-info btn-sm" id="btn-rel-qtd-curso">Quantidade por Curso</button>
                    <button type="button" class="btn btn-dark btn-sm" id="btn-rel-todos">Exibir Todos os Relatórios</button>
                </div>

                <div id="resultado-relatorios" class="alert alert-light border mb-0">
                    <p class="mb-0 text-muted">Cadastre alunos ou clique nos botões acima para visualizar os relatórios.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
