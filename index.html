<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>DevTech Academy - Gerenciamento de Alunos</title>
</head>
<body>
    <h1>DevTech Academy - Cadastro de Alunos</h1>

    <form id="form-aluno">
        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>
        </div>
        <br>
        <div>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" required>
        </div>
        <br>
        <div>
            <label for="curso">Curso:</label>
            <select id="curso" required>
                <option value="">Selecione um curso</option>
                <option value="JavaScript">JavaScript</option>
                <option value="Python">Python</option>
                <option value="Java">Java</option>
            </select>
        </div>
        <br>
        <div>
            <label for="notaFinal">Nota Final:</label>
            <input type="number" id="notaFinal" step="0.1" min="0" max="10" required>
        </div>
        <br>
        <button type="button" id="btn-salvar">Cadastrar</button>
    </form>

    <hr>

    <h2>Lista de Alunos</h2>
    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Curso</th>
                <th>Nota Final</th>
                <th>Situação</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-corpo">
        </tbody>
    </table>

	<hr>

    <h2>Relatórios</h2>
    <div>
        <button type="button" id="btn-rel-aprovados">Listar Aprovados</button>
        <button type="button" id="btn-rel-media-notas">Média das Notas</button>
        <button type="button" id="btn-rel-media-idades">Média das Idades</button>
        <button type="button" id="btn-rel-ordem-alfabetica">Ordem Alfabética</button>
        <button type="button" id="btn-rel-qtd-curso">Quantidade por Curso</button>
        <button type="button" id="btn-rel-todos">Exibir Todos os Relatórios</button>
    </div>
    <br>
    <div id="resultado-relatorios">
        <p>Cadastre alunos ou clique nos botões acima para visualizar os relatórios.</p>
    </div>
    <script src="app.js"></script>
</body>
</html>
