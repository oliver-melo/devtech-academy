<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>DevTech Academy - Gerenciamento de Alunos</title>
</head>
<body>
    <h1>DevTech Academy - Cadastro de Alunos</h1>

    <form id="form-aluno" onsubmit="event.preventDefault();">
        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>
        </div>
        <br>
        <div>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" required>
        </div>
        <br>
        <div>
            <label for="curso">Curso:</label>
            <select id="curso" required>
                <option value="">Selecione um curso</option>
                <option value="JavaScript">JavaScript</option>
                <option value="Python">Python</option>
                <option value="Java">Java</option>
            </select>
        </div>
        <br>
        <div>
            <label for="notaFinal">Nota Final:</label>
            <input type="number" id="notaFinal" step="0.1" min="0" max="10" required>
        </div>
        <br>
        <button type="button" id="btn-salvar" onclick="salvarAluno()">Cadastrar</button>
    </form>

    <hr>

	 <h2>Lista de Alunos</h2>
    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Curso</th>
                <th>Nota Final</th>
                <th>Situação</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-corpo">
        </tbody>
    </table>    

	<script src="app.js"></script>

</body>
</html>
